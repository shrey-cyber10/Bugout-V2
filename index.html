<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <meta name="description" content="BUGOUT — the student network for questions, coding, resources, opportunities and student identity.">
  <title>BUGOUT — The Student Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="bootScreen" class="boot-screen" aria-label="BUGOUT loading">
    <div class="boot-grid"></div>
    <div class="boot-noise"></div>
    <div class="boot-scan"></div>
    <div class="boot-logo-stack">
      <img class="boot-logo ghost red" src="assets/bugout-logo.svg" alt="">
      <img class="boot-logo ghost blue" src="assets/bugout-logo.svg" alt="">
      <img class="boot-logo main" src="assets/bugout-logo.svg" alt="BUGOUT">
    </div>
    <div class="boot-meta"><span>BUGOUT // STUDENT NETWORK</span><span id="bootText">LINKING NETWORK...</span></div>
    <div class="boot-progress"><i></i></div>
  </div>

  <header class="topbar" id="topbar">
    <button class="brand" data-route="home" aria-label="BUGOUT home"><img src="assets/bugout-logo.svg" alt="BUGOUT"></button>
    <nav class="main-nav" aria-label="Primary navigation">
      <button data-route="home" class="active">Home</button>
      <button data-route="community">Community</button>
      <button data-route="codeverse">Codeverse</button>
      <button data-route="resources">Resources</button>
      <button data-route="opportunities">Opportunities</button>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Search">⌕</button>
      <button class="auth-chip" id="authBtn">Sign in</button>
      <button class="profile-chip" id="profileBtn" data-route="profile" aria-label="Profile"><span id="avatarMini">G</span></button>
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button data-route="home"><span>⌂</span>Home</button>
    <button data-route="community"><span>◫</span>Network</button>
    <button data-route="codeverse"><span>⌘</span>Code</button>
    <button data-route="resources"><span>▱</span>Vault</button>
    <button data-route="profile"><span>◎</span>Profile</button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="assets/js/app.js"></script>
</body>
</html>
